on:
  push:
    branches:
    - main
    - release/*
  workflow_dispatch:
  schedule:
  - cron: "30 19 * * *"
jobs:
  build-linux:
    name: compile for linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
          
      - name: Set up GCC
        uses: egor-tensin/setup-gcc@v2
        with:
          platform: x64
      - name: Create Output Directory
        run: mkdir -p dist
      - name: Compile
        run: gcc -Wall -o dist/cwup main.c -lX11
      - name: Upload
        uses: "actions/upload-artifact@v4"
        with:
          name: CWUP-linux-distribution
          path: dist/cwup

  build-object-linux:
    name: compile for linux (cwup.o)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
          
      - name: Set up GCC
        uses: egor-tensin/setup-gcc@v2
        with:
          platform: x64
      - name: Create Output Directory
        run: mkdir -p dist
      - name: Compile
        run: gcc -fPIC -c cwup.c -o dist/cwup-linux.o
      - name: Upload
        uses: "actions/upload-artifact@v4"
        with:
          name: CWUP-object-linux-distribution
          path: dist/cwup-linux.o


  build-object-windows:
    name: compile object for windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up mingw
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: x64
          
      - name: Create Output Directory
        run: mkdir -p dist
        
      - name: Compile
        run: gcc -fPIC -c main.c -o dist/cwup-windows.o
        
      - name: Upload
        uses: "actions/upload-artifact@v4"
        with:
          name: CWUP-object-windows-distribution
          path: dist/cwup-windows.o

  build-windows:
      name: compile for windows
      runs-on: windows-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
          
        - name: Set up mingw
          uses: egor-tensin/setup-mingw@v3
          with:
            platform: x64
            
        - name: Create Output Directory
          run: mkdir -p dist
          
        - name: Compile
          run: gcc -Wall -o dist/cwup.exe cwup.c -lgdi32
          
        - name: Upload
          uses: "actions/upload-artifact@v4"
          with:
            name: CWUP-windows-distribution
            path: dist/cwup.exe

          
  release-nightly:
    name: Create GitHub Release
    needs: [build-linux, build-windows,build-object-linux,build-object-windows] # This makes sure the build finishes first!
    
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux Binary from Build Job
        uses: actions/download-artifact@v4
        with:
          name: CWUP-linux-distribution
          path: release-assets
          
      - name: Download Linux Object from Build Job
        uses: actions/download-artifact@v4
        with:
          name: CWUP-object-linux-distribution
          path: release-assets
          
      - name: Download Windows Binary from Build Job
        uses: actions/download-artifact@v4
        with:
          name: CWUP-windows-distribution
          path: release-assets
      - name: Download Windows Object from Build Job
        uses: actions/download-artifact@v4
        with:
          name: CWUP-object-windows-distribution
          path: release-assets
        


      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/cwup
            release-assets/cwup.exe
            release-assets/cwup-linux.o
            release-assets/cwup-windows.o
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('CWUP Version {0}', github.ref_name) || 'CWUP Nightly Build' }}
          body: |
            Automatic build of CWUP
            Ref: ${{ github.sha }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  release-nightly-linux:
    name: Create GitHub Release For Linux
    needs:  [build-linux, build-object-linux] # This makes sure the build finishes first!
    
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux Binary from Build Job
        uses: actions/download-artifact@v4
        with:
          name: CWUP-linux-distribution
          path: release-assets
      - name: Download Linux Object from Build Job
        uses: actions/download-artifact@v4
        with:
          name: CWUP-object-linux-distribution
          path: release-assets

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/cwup
            release-assets/cwup-linux.o
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-linux' }}
          name: ${{ github.ref_type == 'tag' && format('CWUP Version {0}', github.ref_name) || 'CWUP Nightly Build' }}
          body: |
            Automatic build of CWUP for Linux x64.
            Ref: ${{ github.sha }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-versioned:
    name: Create Versioned GitHub Release
    needs: [build-linux, build-windows] # This makes sure the build finishes first!
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux Binary from Build Job
        uses: actions/download-artifact@v4
        with:
          name: CWUP-linux-distribution
          path: release-assets

      - name: Download Windows Binary from Build Job
        uses: actions/download-artifact@v4
        with:
          name: CWUP-windows-distribution
          path: release-assets

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/cwup
            release-assets/cwup.exe
          tag_name: "build-${{ github.run_number }}"
          name: "CWUP Build #${{ github.run_number }}"
          body: "Automatic build from commit ${{ github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-objects-nightly:
      name: Publish The CWUP objects
      needs: [build-object-linux,build-object-windows] # This makes sure the build finishes first!
      
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
            
        - name: Download Linux Object from Build Job
          uses: actions/download-artifact@v4
          with:
            name: CWUP-object-linux-distribution
            path: release-assets
            
        - name: Download Windows Object from Build Job
          uses: actions/download-artifact@v4
          with:
            name: CWUP-object-windows-distribution
            path: release-assets
          
  
  
        - name: Publish Release
          uses: softprops/action-gh-release@v2
          with:
            files: |
              release-assets/cwup-linux.o
              release-assets/cwup-windows.o
            tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-objects' }}
            name: ${{ github.ref_type == 'tag' && format('CWUP Version {0}', github.ref_name) || 'CWUP Nightly Build (Objects)' }}
            body: |
              Automatic build of CWUP
              Ref: ${{ github.sha }}
            overwrite_files: true
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
