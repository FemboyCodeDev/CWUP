on:
  push:
    branches:
    - main
    - release/*
  workflow_dispatch:
jobs:
  build-linux:
    name: compile for linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
          
      - name: Set up GCC
        uses: egor-tensin/setup-gcc@v2
        with:
          version: latest
          platform: x64
      - name: Create Output Directory
        run: mkdir -p dist
      - name: Compile
        run: gcc -Wall -o dist/cwup cwup.c -lX11
      - name: Upload
        uses: "actions/upload-artifact@v4"
        with:
          name: CWUP-linux-distribution
          path: dist/cwup


  build-windows:
    name: compile for window
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@v3
        with:
          version: latest
          platform: x64
          
      - name: Create Output Directory
        run: mkdir -p dist
      - name: Compile
        run: gcc -Wall -o dist/cwup.exe cwup.c -lX11
      - name: Upload
        uses: "actions/upload-artifact@v4"
        with:
          name: CWUP-windows-distribution
          path: dist/cwup

          
  release-nightly:
    name: Create GitHub Release
    needs: [build-linux, build-windows] # This makes sure the build finishes first!
    
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Binary from Build Job
        uses: actions/download-artifact@v4
        with:
          name: CWUP-linux-distribution
          path: release-assets

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/cwup
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('CWUP Version {0}', github.ref_name) || 'CWUP Nightly Build' }}
          body: |
            Automatic build of CWUP for Linux x64.
            Ref: ${{ github.sha }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-versioned:
    name: Create Versioned GitHub Release
    needs: build-linux # This makes sure the build finishes first!
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Binary from Build Job
        uses: actions/download-artifact@v4
        with:
          name: CWUP-linux-distribution
          path: release-assets

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/cwup
          tag_name: "build-${{ github.run_number }}"
          name: "CWUP Build #${{ github.run_number }}"
          body: "Automatic build from commit ${{ github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
