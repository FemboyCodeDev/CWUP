on:
  push:
    branches:
      - main
      - 'release/*'
    tags:
      - 'v*' # Trigger on version tags like v1.0.0
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *"

jobs:
  build-linux:
    name: compile for linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      - uses: egor-tensin/setup-gcc@v2
        with:
          platform: x64
      - name: Compile Binary and Object
        run: |
          mkdir -p dist
          # Compile the main executable using BOTH files
          gcc -Wall -o dist/cwup main.c cwup.c -lX11
          # Compile just the object file
          gcc -fPIC -c cwup.c -o dist/cwup-linux.o
      - uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: |
            dist/cwup
            dist/cwup-linux.o

  build-windows:
    name: compile for windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: egor-tensin/setup-mingw@v3
        with:
          platform: x64
      - name: Compile Binary and Object
        run: |
          mkdir dist
          # Compile the Windows exe using BOTH files
          gcc -Wall -o dist/cwup.exe main.c cwup.c -lgdi32
          # Compile just the object file
          gcc -fPIC -c cwup.c -o dist/cwup-windows.o
      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            dist/cwup.exe
            dist/cwup-windows.o
  release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/cwup
            release-assets/cwup.exe
            release-assets/cwup-linux.o
            release-assets/cwup-windows.o
          # If triggered by a tag, use the tag name. Otherwise, use 'latest'.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('CWUP Version {0}', github.ref_name) || 'CWUP Nightly Build' }}
          body: |
            Automatic build of CWUP
            Ref: ${{ github.sha }}
          # 'latest' is marked as a prerelease; tagged versions are full releases
          prerelease: ${{ github.ref_type != 'tag' }}
          # This ensures the 'latest' release is updated every night/push
          make_latest: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
