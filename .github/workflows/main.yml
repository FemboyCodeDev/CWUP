on:
  push:
    branches:
    - main
    - release/*
  workflow_dispatch:
jobs:
  build-linux:
    name: deploy to staging
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
          
      - name: Set up GCC
        uses: egor-tensin/setup-gcc@v2
        with:
          version: latest
          platform: x64
      - name: Create Output Directory
        run: mkdir -p dist
      - name: Compile
        run: gcc -Wall -o dist/cwup cwup.c -lX11
      - name: Upload
        uses: "actions/upload-artifact@v4"
        with:
          name: CWUP-linux-distribution
          path: dist/cwup

          
  release:
    name: Create GitHub Release
    needs: build-linux # This makes sure the build finishes first!
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Binary from Build Job
        uses: actions/download-artifact@v4
        with:
          name: compiled-binary
          path: release-assets

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/cwup
          name: CWUP Version ${{ github.ref_name }}
          body: "Automatic build of CWUP for Linux x64."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
